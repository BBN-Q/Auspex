[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auspex-v2"
version = "0.0.0"
description = "Auspex V2 experimental control system"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["numpy>=2.1"]
license = { text = "Apache-2.0" }

[project.optional-dependencies]
visa = ["PyVISA>=1.14", "PyVISA-py>=0.7"]
gui = ["PySide6>=6.8", "pyqtgraph>=0.13.7"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["auspex_v2*"]
